name: CRM archive cleanup (temporary)
# One-off: archives open CRM accounts that have gone quiet (no activity past
# their stage limit, no future next step), except anything Amazon. Reversible:
# each keeps its stage in preArchiveStage and can be restored in the app.
on:
  push:
    branches: [claude/feedback-export]
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Archive quiet opportunities
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -e
          mkdir -p /tmp/fx && cd /tmp/fx
          printf '%s' "$SA" > sa.json
          npm init -y >/dev/null && npm i --silent firebase-admin@12 >/dev/null
          cat > run.js <<'JS'
          const admin=require('firebase-admin');
          admin.initializeApp({credential:admin.credential.cert(require('./sa.json'))});
          const db=admin.firestore();
          const ROT={New:21,Contacted:21,Engaged:14,Meeting:14,Proposal:10};
          const MON={january:0,february:1,march:2,april:3,may:4,june:5,july:6,august:7,september:8,october:9,november:10,december:11};
          function pDate(s){if(!s)return null;s=(''+s).trim();const m=s.match(/^(\d{1,2})\/([A-Za-z]+)\/(\d{4})/);
            if(m){const mo=MON[m[2].toLowerCase()];if(mo!=null)return new Date(+m[3],mo,+m[1]).getTime()}const d=Date.parse(s);return isNaN(d)?null:d}
          function lastAct(a){const ds=[];(a.notes||[]).forEach(n=>{const d=pDate(n.at);if(d)ds.push(d)});const dd=pDate(a.date);if(dd)ds.push(dd);
            ['stageChangedAt','createdAt','restoredAt'].forEach(k=>{const v=a[k]?Date.parse(a[k]):NaN;if(!isNaN(v))ds.push(v)});return ds.length?Math.max(...ds):null}
          (async()=>{const now=Date.now(),today=new Date(new Date().toISOString().slice(0,10)).getTime();
            const qs=await db.collection('crm_accounts').get();let n=0,kept=0,amazon=0,closed=0,already=0;let batch=db.batch(),inBatch=0;
            for(const d of qs.docs){const a=d.data();const st=a.stage||'New';
              if(a.archived){already++;continue}
              if(!(st in ROT)){closed++;continue}
              if(/amazon/i.test((a.name||'')+' '+(a.company||''))){amazon++;continue}
              const due=a.dueAt?Date.parse(String(a.dueAt).slice(0,10)):NaN;
              if(!isNaN(due)&&due>=today){kept++;continue}
              const la=lastAct(a);if(la!=null&&(now-la)/864e5<=ROT[st]){kept++;continue}
              const patch={archived:true,archivedAt:new Date().toISOString(),archivedBy:'Brad Herald (via Claude)',archiveReason:'Stale — no activity (pipeline cleanup)',preArchiveStage:st};
              if(a.campaign&&a.campaign.status==='active')patch.campaign=Object.assign({},a.campaign,{status:'stopped'});
              batch.set(d.ref,patch,{merge:true});n++;if(++inBatch>=400){await batch.commit();batch=db.batch();inBatch=0}}
            if(inBatch)await batch.commit();
            console.log('archived',n,'| amazon kept',amazon,'| active kept',kept,'| won/lost untouched',closed,'| already archived',already);process.exit(0)})().catch(e=>{console.error('failed',e.message);process.exit(1)});
          JS
          node run.js
          rm -f sa.json
      - name: Remove temporary snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete crmx-44871307137 --repo ${{ github.repository }} --cleanup-tag -y || true

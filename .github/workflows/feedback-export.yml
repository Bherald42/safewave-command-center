name: Feedback close-out (temporary)
# One-off: posts a reply on each worked feedback item, marks it resolved,
# turns firmware/hardware items into Build board tasks, alerts submitters,
# and removes the earlier temporary encrypted export release.
on:
  push:
    branches: [claude/feedback-export]
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Close feedback
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -e
          mkdir -p /tmp/fx && cp .github/feedback-close.json /tmp/fx/plan.json && cd /tmp/fx
          printf '%s' "$SA" > sa.json
          npm init -y >/dev/null && npm i --silent firebase-admin@12 >/dev/null
          cat > close.js <<'JS'
          const admin=require('firebase-admin');
          admin.initializeApp({credential:admin.credential.cert(require('./sa.json'))});
          const db=admin.firestore(),FV=admin.firestore.FieldValue;
          const plan=require('./plan.json');
          (async()=>{
            const su=await db.collection('users').where('email','==','brad.herald@safewavetech.com').limit(1).get();
            const sup=su.empty?{uid:'admin',name:'Brad Herald'}:{uid:su.docs[0].id,name:su.docs[0].data().name||'Brad Herald'};
            const tasks={};let resolved=0,skipped=0,alerts=0;
            for(const it of plan){
              const ref=db.collection('feedback').doc(it.id);const snap=await ref.get();
              if(!snap.exists){skipped++;continue}
              const f=snap.data();
              if(it.task){const t=tasks[it.task.key]||(tasks[it.task.key]=Object.assign({},it.task,{notes:[]}));
                const when=f.createdAt&&f.createdAt.toDate?f.createdAt.toDate().toISOString().slice(0,10):'';
                t.notes.push('From feedback · '+(f.fromName||'teammate')+(when?' · '+when:'')+'\n'+(f.text||''));}
              if(f.status==='resolved'){skipped++;continue}
              const msg={by:sup.name+' (via Claude)',uid:sup.uid,text:it.reply,at:Date.now()};
              await ref.update({thread:FV.arrayUnion(msg),lastReplyAt:FV.serverTimestamp(),status:'resolved',resolvedAt:FV.serverTimestamp()});
              resolved++;
              if(f.fromUid&&f.fromUid!==sup.uid){await db.collection('notifications').add({to:f.fromUid,title:'Reply to your feedback',body:it.reply.slice(0,140),link:'s-feedback',by:sup.name,at:FV.serverTimestamp()});alerts++}
            }
            let made=0;
            for(const k of Object.keys(tasks)){const t=tasks[k];const ref=db.collection('build_tasks').doc(k);const ex=await ref.get();
              if(ex.exists)continue;
              await ref.set({id:k,title:t.title,projectId:'',assignee:'',start:'',due:'',status:'todo',priority:t.priority||'medium',watchers:[],deps:[],cost:0,spent:0,costCat:'none',notes:t.notes.join('\n\n'),source:'feedback',createdAt:new Date().toISOString()});made++}
            console.log('resolved',resolved,'skipped',skipped,'alerts',alerts,'build tasks',made);process.exit(0)})().catch(e=>{console.error('failed',e.message);process.exit(1)});
          JS
          node close.js
          rm -f sa.json
      - name: Remove temporary export release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete fbx-44867719742 --repo ${{ github.repository }} --cleanup-tag -y || true

name: Deploy Cloud Functions

# Auto-deploys the Cloud Functions whenever functions code changes on main,
# and can still be run manually from the Actions tab. Kept separate from the
# hosting workflow so it can never affect the live site deploy.
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install function dependencies
        run: npm ci --prefix functions || npm install --prefix functions
      - name: Write service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          SHOPIFY_WEBHOOK_SECRET: ${{ secrets.SHOPIFY_WEBHOOK_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g firebase-tools
          # Inject secrets (stored as encrypted repo secrets) into the function's
          # runtime env. functions/.env is gitignored, so keys are never committed
          # to the repo — they only exist on the deploy runner.
          : > functions/.env
          if [ -n "$PLACES_API_KEY" ]; then echo "PLACES_API_KEY=$PLACES_API_KEY" >> functions/.env; fi
          if [ -n "$SHOPIFY_WEBHOOK_SECRET" ]; then echo "SHOPIFY_WEBHOOK_SECRET=$SHOPIFY_WEBHOOK_SECRET" >> functions/.env; fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> functions/.env; fi
          firebase deploy --only functions --project safewave-command-center --non-interactive --force
      - name: Deploy Firestore + Storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          # Non-fatal: if the service account lacks rules-admin permission this
          # logs and continues (publish rules manually in the console instead).
          firebase deploy --only firestore:rules --project safewave-command-center --non-interactive || echo "::warning::Firestore rules deploy skipped — check permissions or publish manually."
          # Storage rules only deploy once Storage is enabled in the console.
          firebase deploy --only storage --project safewave-command-center --non-interactive || echo "::warning::Storage rules deploy skipped — enable Storage in the Firebase console first."

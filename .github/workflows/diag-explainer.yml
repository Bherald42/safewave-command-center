name: Diagnose explainer hosting (one-off)
on:
  push:
    branches: [ claude/release-qc-fill ]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the explainer files like an iPhone would
        run: |
          U=https://safewave-command-center.web.app/explainer
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.1 Mobile/15E148 Safari/604.1'
          for f in "" index.html poster.jpg release-qc-explainer.mp4; do
            echo "=== $U/$f"; curl -sS -A "$UA" -o /tmp/b -D - "$U/$f" | grep -iE '^HTTP|content-type|content-length|accept-ranges|cache-control|etag'; head -c 120 /tmp/b | tr -c '[:print:]' '.'; echo
          done
          echo "=== range request x3"; for n in 1 2 3; do curl -sS -A "$UA" -r 0-1 -D - -o /dev/null "$U/release-qc-explainer.mp4" | grep -iE '^HTTP|content-range|content-length|cache-control'; sleep 2; done
          echo "=== sw.js"; curl -sS https://safewave-command-center.web.app/sw.js | grep -n "explainer\|CACHE ="
